location = /phasegaze { return 301 /phasegaze/; }

# Static UI from disk so Launch can open before the unit binds :8001.
# Only the CSI websocket is proxied; a 502 there is handled by net.js reconnect.
location /phasegaze/ws {
    proxy_pass http://127.0.0.1:8001/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /phasegaze/ {
    alias /usr/share/quadrf/phasegaze/;
    index index.html;
    add_header Cache-Control "no-store";
}
